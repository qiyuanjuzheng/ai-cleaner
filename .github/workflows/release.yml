name: Build and publish AI Cleaner

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
    secrets:
      SPARKLE_PRIVATE_ED_KEY:
        required: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-pr.yml
      - Package.swift
      - Sources/**
      - Tests/**
      - rules/**
      - protocol/rules-v1.schema.json
      - scripts/**

permissions: {}

concurrency:
  group: ai-cleaner-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package macOS release
    if: github.event_name != 'pull_request' || github.head_ref != 'release-pr/main'
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            tag="$(awk '/^## \[v?[0-9]+\.[0-9]+\.[0-9]+\]/ {gsub(/[][]/, "", $2); sub(/^v/, "", $2); print "v" $2; exit}' CHANGELOG.md)"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version in vX.Y.Z format" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          swift test
          ./scripts/test-release-pr.sh

      - name: Verify embedded rules match the JSON packs
        run: |
          rules_venv="$RUNNER_TEMP/ai-cleaner-rules"
          python3 -m venv "$rules_venv"
          "$rules_venv/bin/python" -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          "$rules_venv/bin/python" scripts/generate-built-in-rules.py --check

      - name: Prepare update signing
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          SPARKLE_PRIVATE_ED_KEY: ${{ github.event_name != 'pull_request' && secrets.SPARKLE_PRIVATE_ED_KEY || '' }}
        run: |
          signing_key="$SPARKLE_PRIVATE_ED_KEY"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            signing_key="$(openssl rand -base64 32)"
            echo "::add-mask::$signing_key"
            printf 'SPARKLE_TEST_ED_KEY=%s\n' "$signing_key" >> "$GITHUB_ENV"
          elif [[ -z "$signing_key" ]]; then
            echo "::error::Configure the SPARKLE_PRIVATE_ED_KEY repository secret to sign releases."
            exit 1
          fi
          public_key="$(printf '%s\n' "$signing_key" | swift scripts/sparkle-public-key.swift)"
          printf 'public_key=%s\n' "$public_key" >> "$GITHUB_OUTPUT"

      - name: Build and verify release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_PUBLIC_ED_KEY: ${{ steps.signing.outputs.public_key }}
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
        run: |
          ./scripts/build-release-assets.sh --tag "$TAG"
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)
          ./scripts/generate-release-notes.sh "$TAG" > dist/release/release-notes.md

      - name: Sign ZIP and generate appcast
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_ED_KEY: ${{ github.event_name != 'pull_request' && secrets.SPARKLE_PRIVATE_ED_KEY || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            export SPARKLE_PRIVATE_ED_KEY="$SPARKLE_TEST_ED_KEY"
          fi
          bash scripts/generate-update-feed.sh "$TAG" "$REPOSITORY"

      - name: Upload release build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release

      - name: Create or update release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          test -s appcast.xml
          assets=("AI-Cleaner-${TAG}-macOS.dmg" "AI-Cleaner-${TAG}-macOS.zip" SHA256SUMS.txt appcast.xml)
          if release=$(gh release view "$TAG" --json assets,isDraft 2>/dev/null); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release upload "$TAG" "${assets[@]}" --clobber
              gh release edit "$TAG" --title "AI Cleaner $TAG" --notes-file release-notes.md --draft=false
            elif ! jq -e 'any(.assets[]; .name == "appcast.xml")' <<< "$release" >/dev/null; then
              echo "::error::This tag is already published without an appcast. Publish a new version."
              exit 1
            fi
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "AI Cleaner $TAG" --notes-file release-notes.md
          fi
