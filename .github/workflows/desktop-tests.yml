name: Desktop Tauri & E2E Tests

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - protocol/**
      - Sources/AICleanerCore/**
      - Sources/AICleanerSidecar/**
      - Sources/CPlatformSupport/**
      - .github/workflows/desktop-tests.yml
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/**
      - protocol/**
      - Sources/AICleanerCore/**
      - Sources/AICleanerSidecar/**
      - Sources/CPlatformSupport/**
      - .github/workflows/desktop-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · Frontend + Tauri Host + Real Sidecar E2E
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies, build & run unit/protocol tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test

      - name: Build Swift aicleaner-core sidecar
        run: |
          swift build --product aicleaner-core
          echo "AI_CLEANER_SIDECAR_PATH=$(swift build --show-bin-path)/aicleaner-core" >> "$GITHUB_ENV"

      - name: Build & test Tauri 2 Rust host (with real Swift sidecar)
        working-directory: apps/desktop/src-tauri
        run: cargo test -- --nocapture

      - name: Install Playwright Chromium & run real-sidecar E2E
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run test:e2e

  linux:
    name: Linux · Frontend + Tauri Host + Real Sidecar E2E
    runs-on: ubuntu-latest
    container: swift:6.4.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Tauri GTK/WebKit2GTK & Playwright system dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ca-certificates \
            gnupg >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies, build & run unit/protocol tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test

      - name: Build Swift aicleaner-core sidecar
        run: |
          swift build --product aicleaner-core
          echo "AI_CLEANER_SIDECAR_PATH=$(swift build --show-bin-path)/aicleaner-core" >> "$GITHUB_ENV"

      - name: Build & test Tauri 2 Rust host (with real Swift sidecar)
        working-directory: apps/desktop/src-tauri
        run: cargo test -- --nocapture

      - name: Install Playwright Chromium & run real-sidecar E2E
        working-directory: apps/desktop
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  windows:
    name: Windows · Frontend + Tauri Host + Real Sidecar E2E
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE

      - name: Install frontend dependencies, build & run unit/protocol tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test

      - name: Build Swift aicleaner-core sidecar
        run: |
          swift build --product aicleaner-core
          $binDir = (swift build --show-bin-path).Trim()
          "AI_CLEANER_SIDECAR_PATH=$binDir\aicleaner-core.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & test Tauri 2 Rust host (with real Swift sidecar)
        working-directory: apps/desktop/src-tauri
        run: cargo test -- --nocapture

      - name: Install Playwright Chromium & run real-sidecar E2E
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run test:e2e
