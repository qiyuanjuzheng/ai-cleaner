name: Build and publish AI Cleaner

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-pr.yml
      - .github/workflows/tauri-packaging.yml
      - scripts/release-*
      - scripts/generate-release-notes.sh
      - scripts/test-release-pr.sh
      - scripts/*tauri*

permissions: {}

concurrency:
  group: ai-cleaner-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Core and Tauri release tooling
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Verify release automation
        run: |
          ./scripts/test-release-pr.sh
          python3 scripts/test-tauri-update-feed.py
      - name: Verify Swift and embedded rule packs
        if: github.event_name != 'pull_request'
        run: |
          swift test
          rules_venv="$RUNNER_TEMP/ai-cleaner-rules"
          python3 -m venv "$rules_venv"
          "$rules_venv/bin/python" -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          "$rules_venv/bin/python" scripts/generate-built-in-rules.py --check

  packages:
    name: Build Tauri installers and signed update assets
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/tauri-packaging.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    name: Publish Tauri release to GitHub
    if: github.event_name != 'pull_request'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tauri-preview-*
          path: dist/tauri-download
      - name: Install the update signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Assemble and validate release assets
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          # Keep release notes accurate when a retry checks out the previous v1.0.1 helper.
          TAURI_PLATFORM_SIGNING: 'false'
        run: |
          assets=dist/release
          mkdir -p "$assets"
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            # GitHub rewrites spaces in uploaded filenames. Normalize before generating URLs.
            name="${name// /-}"
            if [[ -e "$assets/$name" ]]; then
              echo "::error::Found two release assets named $name"
              exit 1
            fi
            cp "$asset" "$assets/$name"
          done < <(find dist/tauri-download -type f ! -name SHA256SUMS.txt -print0)
          for format in dmg exe msi deb rpm AppImage; do
            if ! compgen -G "$assets/*.$format" > /dev/null; then
              echo "::error::Missing $format installer"
              exit 1
            fi
          done
          ./scripts/generate-release-notes.sh --tauri "$TAG" > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/generate-tauri-update-feed.py "$TAG" "$GITHUB_REPOSITORY" "$assets" "$RUNNER_TEMP/release-notes.md" --verify
          (cd "$assets" && sha256sum -- * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish the fully staged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          assets=(dist/release/*)
          if release=$(gh release view "$TAG" --json assets,isDraft 2>/dev/null); then
            if ! jq -e '.isDraft' <<< "$release" >/dev/null; then
              jq -e 'any(.assets[]; .name == "latest.json")' <<< "$release" >/dev/null
              exit
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "AI Cleaner $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --title "AI Cleaner $TAG" --notes-file "$notes" --draft=false --latest
